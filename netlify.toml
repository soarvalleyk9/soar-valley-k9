# These settings override anything left in the Netlify UI from the original
# README-only deploy (empty build command, publish directory at the repo root).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # The Next.js runtime looks for .next/standalone. Setting this here means
  # `next build` produces it even if a UI build image drops plugin env vars.
  # Do not set NODE_ENV=production here: that makes npm skip devDependencies
  # (TypeScript, Tailwind, PostCSS) and the build fails.
  NEXT_PRIVATE_STANDALONE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.scheduled-maintenance]
  schedule = "*/5 * * * *"

[functions.scheduled-digest]
  schedule = "0 5,6 * * *"

[functions.scheduled-keepalive]
  schedule = "0 12 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
